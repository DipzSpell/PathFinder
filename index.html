<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PathFinder — Career Roadmap for Indian Students</title>
    <meta name="color-scheme" content="light dark" />
    <script>
      // Apply the saved theme before first paint so dark mode doesn't flash white.
      try {
        var theme = localStorage.getItem('pathfinder:theme')
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
        if (localStorage.getItem('pathfinder:lang') === 'hi') document.documentElement.lang = 'hi'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
